[package]
name = "swarm-router"
version = "0.1.0"
authors = ["Nick Hirakawa <nickhirakawa@gmail.com>"]
edition = "2024"
description = "A process router for running and testing SWIM implementations"
repository = "https://github.com/nhirakawa/swarm.git"
license = "MIT"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive", "env"] }
humantime = "2.4.0"
nix = { version = "0.31.3", features = ["signal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
